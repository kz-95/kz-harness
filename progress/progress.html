<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KzH progress</title>
<style>
:root{
  color-scheme: light dark;
  --bg:#ffffff; --fg:#1a1c1f; --muted:#6b6f76; --line:#e3e5e8; --card:#f6f7f8;
  --ok:#1d7a4d; --okbg:#e6f4ec; --warn:#8a5a06; --warnbg:#fdf3e2; --bad:#a32d2d; --badbg:#fceaea;
  --info:#185fa5; --infobg:#e7f0fa; --off:#5f6167; --offbg:#eeeff1;
  --radius:10px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#181818; --fg:#e8e8e8; --muted:#9a9da4; --line:#303235; --card:#1f2022;
    --ok:#7fd3a3; --okbg:#14301f; --warn:#f0c07a; --warnbg:#332612; --bad:#f09595; --badbg:#3a1a1a;
    --info:#85b7eb; --infobg:#12283f; --off:#9a9da4; --offbg:#26282b;
  }
}
*{box-sizing:border-box}
body{margin:0;padding:24px;background:var(--bg);color:var(--fg);
  font:15px/1.6 system-ui,-apple-system,Segoe UI,sans-serif}
h1{font-size:20px;font-weight:500;margin:0 0 2px}
.sub{color:var(--muted);font-size:13px;margin:0 0 20px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:22px}
.tile{background:var(--card);border-radius:var(--radius);padding:12px 14px}
.tile .n{font-size:24px;font-weight:500;line-height:1.2}
.tile .l{font-size:12px;color:var(--muted)}
.barline{font-size:13px;margin:0 0 7px}
.barline b{font-weight:500}
.bar{display:flex;height:14px;border-radius:999px;overflow:hidden;background:var(--offbg);
  border:1px solid var(--line)}
.bar span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--muted);margin:8px 0 22px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--line);vertical-align:top}
th{position:sticky;top:0;background:var(--bg);white-space:nowrap}
th button{all:unset;cursor:pointer;font-weight:500;display:inline-flex;gap:4px;align-items:center}
th button:focus-visible{outline:2px solid var(--info);outline-offset:2px}
th .ar{color:var(--muted);font-size:10px}
th input{width:100%;margin-top:5px;padding:3px 6px;font:inherit;font-size:12px;
  background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;white-space:nowrap}
.s-verified{background:var(--okbg);color:var(--ok)}
.s-built{background:var(--infobg);color:var(--info)}
.s-partial{background:var(--warnbg);color:var(--warn)}
.s-open{background:var(--badbg);color:var(--bad)}
.s-blocked{background:var(--badbg);color:var(--bad)}
.s-todo{background:var(--offbg);color:var(--off)}
td.note{color:var(--muted)}
.count{color:var(--muted);font-size:12px;margin:10px 0 0}
.empty{color:var(--muted);padding:18px 9px}
code{font:12px/1.5 ui-monospace,Consolas,monospace;background:var(--card);padding:1px 5px;border-radius:4px}
</style>
</head>

  ['Built', DATA.filter(d => d.status === 'built').length, 'not yet watched'],
  ['Open', DATA.filter(d => d.status === 'open').length, 'known defects'],
  ['Partial', DATA.filter(d => d.status === 'partial').length, 'left unfinished'],
  ['Tests', TESTS.pass + ' / ' + TESTS.total, 'passing'],
]
document.getElementById('tiles').innerHTML = tiles
  .map(([l, n, s]) => '<div class="tile"><div class="n">' + n + '</div><div class="l">' + l + ' &middot; ' + s + '</div></div>').join('')

// Progress bar, computed from DATA every load, never a written down number.
// Denominator: every row, todo and blocked included. They are known work that is not done,
// and dropping them would make the percentage rise each time a new item is written down.
// They get their own grey segment, so they are counted without reading as progress.
// verified and built stay separate segments: built means the code is in and nobody watched it.
const SEG = [
  ['verified',   'var(--ok)',   d => d.status === 'verified'],
  ['built',      'var(--info)', d => d.status === 'built'],
  ['partial',    'var(--warn)', d => d.status === 'partial'],
  ['open',       'var(--bad)',  d => d.status === 'open'],
  ['not started','var(--off)',  d => d.status === 'todo' || d.status === 'blocked'],
]
const counts = SEG.map(([label, colour, test]) => [label, colour, DATA.filter(test).length])
const verified = counts[0][2]
const vPct = Math.round(verified / DATA.length * 100)
document.getElementById('progress').innerHTML =
  '<p class="barline"><b>' + vPct + ' percent verified</b>, ' + verified + ' of ' + DATA.length +
    ' rows observed working. The rest is not done: ' +
    counts.slice(1).map(([l, c, n]) => n + ' ' + l).join(', ') + '.</p>' +
  '<div class="bar" role="progressbar" aria-valuenow="' + vPct + '" aria-valuemin="0" aria-valuemax="100"' +
    ' aria-label="Verified progress: ' + verified + ' of ' + DATA.length + ' rows observed working">' +
    // flex grow by row count, so the widths are exact and never drift on rounding
    counts.map(([l, colour, n]) => '<span style="flex:' + n + ' 0 0;background:' + colour + '" title="' +
      n + ' ' + l + '"></span>').join('') +
  '</div>' +
  '<p class="legend">' + counts.map(([l, colour, n]) =>
    '<span><i style="background:' + colour + '" aria-hidden="true"></i>' + l + ' ' + n + '</span>').join('') + '</p>'

// Sort and filter on every column: the owner's standing rule for any table.
const filters = {}
let sortKey = null
let sortDir = 1

const head = document.getElementById('head')
head.innerHTML = COLS.map(c =>
  '<th data-k="' + c.key + '" aria-sort="none">' +
    '<button type="button" data-sort="' + c.key + '">' + c.label + ' <span class="ar" aria-hidden="true"></span></button>' +
    '<input type="text" data-filter="' + c.key + '" aria-label="Filter by ' + c.label + '" placeholder="filter">' +
  '</th>').join('')

function view() {
  let rows = DATA.filter(r => COLS.every(c => {
    const q = (filters[c.key] || '').trim().toLowerCase()
    return !q || String(r[c.key]).toLowerCase().includes(q)
  }))
  if (sortKey) {
    // Text compares with numeric collation so any digits inside a label order sensibly.
    rows = rows.slice().sort((a, b) =>
      sortDir * String(a[sortKey]).localeCompare(String(b[sortKey]), undefined, { numeric: true }))
  }
  return rows
}

function render() {
  const rows = view()
  document.getElementById('rows').innerHTML = rows.length
    ? rows.map(r =>
        '<tr><td>' + r.area + '</td><td>' + r.item + '</td>' +
        '<td><span class="pill s-' + r.status + '">' + r.status + '</span></td>' +
        '<td>' + r.check + '</td><td class="note">' + r.note + '</td></tr>').join('')
    : '<tr><td colspan="5" class="empty">No rows match these filters.</td></tr>'
  document.getElementById('count').textContent = rows.length + ' of ' + DATA.length + ' rows'
  for (const th of head.children) {
    const k = th.dataset.k
    const on = sortKey === k
    th.setAttribute('aria-sort', on ? (sortDir === 1 ? 'ascending' : 'descending') : 'none')
    th.querySelector('.ar').textContent = on ? (sortDir === 1 ? '▲' : '▼') : ''
  }
}

head.addEventListener('click', e => {
  const b = e.target.closest('[data-sort]')
  if (!b) return
  const k = b.dataset.sort
  sortDir = sortKey === k ? -sortDir : 1
  sortKey = k
  render()
})
head.addEventListener('input', e => {
  const i = e.target.closest('[data-filter]')
  if (!i) return
  filters[i.dataset.filter] = i.value
  render()
})
render()
</script>
</body>
</html>
