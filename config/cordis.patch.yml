# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).
#
# Jev router setup (see C:\Harness\README.md).

# Executors keep native auth (~/.claude, ~/.codex). Permission modes:
#   claude-code acceptEdits: may edit files in the workspace; other actions
#     need permissions already granted in your Claude settings.
#   codex approve-for-me: workspace-write sandbox, Codex auto-review for
#     anything that needs approval.
# Effort (Settings > Jev setup > Effort): jev-router sets CLAUDE_CODE_EFFORT_LEVEL
#   for claude-code runs; codex effort / 1.5x speed need the one-block patch in
#   dsh-subagent-codex/lib/index.js (turn/start reads KZ_CODEX_EFFORT /
#   KZ_CODEX_SERVICE_TIER; original kept as index.js.orig). A reinstall drops it.
#   Do not set `env: CLAUDE_CODE_EFFORT_LEVEL` here: it would override per-run effort.
- id: subagent-claude-code
  config:
    permissionMode: acceptEdits
- id: subagent-codex
  config:
    permissionMode: approve-for-me

# Router plugin. Agents, limits and thresholds are configurable here; omitted
# fields use the defaults in the plugin's Config schema.
# jev-review judges every result (pass / second opinion / retry / human);
# the router calls it through the `jevReview` service.
- insert:
    - id: jev-review
      name: 'C:/Harness/plugins/jev-review/index.js'
    - id: jev-router
      name: 'C:/Harness/plugins/jev-router/index.js'

# Cost policy. Past this share of its WEEKLY window a subscription stops taking
# execution work and is kept for reviewing, where its remaining percent buys the
# most. Work prefers another subscription still under its own gate; only when every
# subscription is past one does the metered API take over.
# Set per plan: Claude Pro 80 / Max 90, Codex Plus 80 / Pro 90. Not auto-detected:
# the live usage endpoint reports no plan name, and the cached credential lags an
# upgrade, so guessing would gate a Max account at 80 and spend money needlessly.
- id: jev-router
  config:
    policy:
      gateAtPercent:
        default: 80
        claude: 90

# Jev Harness brand: the jev-router client fills the sidebar and hero brand
# slots with C:\Harness\Logo.png, so the official DeepSeek brand steps aside.
- id: ui-brand-official
  disabled: true

# --- Kz-harness privacy: nothing is sent anywhere except the model/API calls you use ---
# Full-transcript upload to harness-telemetry.deepseeksvc.com when feedback is given.
- id: session-telemetry-otel
  disabled: true
# List of every installed package piggybacked on each DeepSeek API request.
- id: plugin-package-inventory-deepseek
  disabled: true
# Session-log upload with DeepSeek requests (off by default); pinned off.
- id: session-log-deepseek
  disabled: true
# Bundled "dsh-badge" skill: tells the model to add a "powered by dsh" badge to
# pull requests and documents. Commits and PRs here carry no tool attribution.
- id: skill-badge
  disabled: true
# Developer-only reload channel (unauthenticated /plugins/events).
- id: client-hmr
  disabled: true

# Feedback surface (Like/Dislike, the feedback dialog, /feedback). Feedback
# was stored locally and only uploaded by session-telemetry-otel (off above);
# nothing else injects these services, so the buttons and command just vanish.
- id: ui-message-feedback
  disabled: true
- id: message-feedback
  disabled: true
- id: command-feedback
  disabled: true

# DeepSeek through DSH's generic pi-ai adapter: route 'deepseek', same
# DEEPSEEK_API_KEY credential, public https://api.deepseek.com. Unlike the
# official connector it sends no x-deepseek-harness-user-id/-session-id/
# -compact headers. Models mirror the official catalog (1M context, efforts
# off/low/high/max, image input on the Flash and vision models).
- id: llm-pi-ai
  config:
    providers:
      deepseek:
        displayName: DeepSeek
        apiKeyEnv: DEEPSEEK_API_KEY
        reasoning: high
        requestImagePixelBudget: 640000
        requestImageMaxBytes: 1048576
        models:
          - id: deepseek-flash
            name: DeepSeek-V41-Flash
            contextWindow: 1000000
            maxTokens: 256000
            input: [text, image]
            reasoningEfforts: { off: null, low: low, high: high, max: max }
          - id: deepseek-v4-flash
            name: DeepSeek-V4-Flash
            contextWindow: 1000000
            maxTokens: 256000
            input: [text]
            reasoningEfforts: { off: null, low: low, high: high, max: max }
          - id: deepseek-v4-pro
            name: DeepSeek-V4-Pro
            contextWindow: 1000000
            maxTokens: 256000
            input: [text]
            reasoningEfforts: { off: null, low: low, high: high, max: max }
          - id: deepseek-v4-flash-vision-exp
            name: DeepSeek-V4-Flash-Vision-Exp
            contextWindow: 1000000
            maxTokens: 256000
            input: [text, image]
            reasoningEfforts: { off: null, low: low, high: high, max: max }
# Fallback default model for new agents (settings.yaml's choice still wins).
- id: agent-default-model
  config:
    provider: deepseek
    model: deepseek-flash

# Official DeepSeek connector: remove this block to bring it back.
# (It adds the anonymous-user-id / session-id / compaction headers to every
# DeepSeek request; also switch jev-router agents.deepseek.llm and auxModel
# back to provider deepseek-official, see README "Privacy".)
- id: llm-deepseek
  disabled: true
